<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OPSX 看板</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Open Design · mission-control：深色單一主題、navy 面板、amber 資料、cyan 動作、mono 讀數、圓角 ≤4px、只有警示會動。
   首頁的欄位都來自 /api/collect（opsx collect）：openspec/、dispatch.json、status.json、herdr、glab。
   紀錄 tab 來自 /api/log（opsx timeline）：每張卡的 decisions.tsv 與 sync.log，開 tab 才拉。 */
:root{
  --bg:#0B1120;--surface:#111827;--surface-hover:#1A2535;--surface-active:#1E3A5F;
  --border:#1E3A5F;--border-soft:#162035;
  --fg:#E8F0FE;--fg-2:#8BA3C7;--fg-3:#4A6080;
  --data:#FFB800;--accent:#00D4FF;--accent-on:#06101D;--danger:#FF4757;--warn:#FF9F43;--success:#26DE81;
  --data-bg:rgba(255,184,0,.12);--accent-bg:rgba(0,212,255,.12);--danger-bg:rgba(255,71,87,.12);--warn-bg:rgba(255,159,67,.12);--success-bg:rgba(38,222,129,.12);
  --pet-claude:#FFB800;--pet-codex:#00D4FF;--pet-frame:#1A2535;--pet-screen:#060A14;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC','Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  --r:4px;--r-sm:2px;
  color-scheme:dark;
}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:var(--font-mono)}
.muted{color:var(--fg-2)}.faint{color:var(--fg-3)}
[hidden]{display:none!important}
button{font-family:var(--font-sans);font-size:13px;font-weight:500;letter-spacing:.01em;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--fg);border-radius:var(--r);min-height:32px;padding:0 12px;transition:background 100ms,border-color 100ms}
button:hover{background:var(--surface-hover)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
button.ghost:hover{background:var(--surface-hover);color:var(--fg)}
button.sm{min-height:28px;padding:0 10px;font-size:12px}
button.danger{color:var(--danger)}
input[type=text],select{font-family:var(--font-sans);font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);min-height:34px;padding:0 10px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--accent)}
input::placeholder{color:var(--fg-3)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-sm);padding:2px 8px;white-space:nowrap;border:1px solid;line-height:1.5}
.badge.data{background:var(--data-bg);color:var(--data);border-color:rgba(255,184,0,.3)}
.badge.ok{background:var(--success-bg);color:var(--success);border-color:rgba(38,222,129,.3)}
.badge.danger{background:var(--danger-bg);color:var(--danger);border-color:rgba(255,71,87,.3)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(255,159,67,.3)}
.badge.accent{background:var(--accent-bg);color:var(--accent);border-color:rgba(0,212,255,.3)}
.badge.line{background:transparent;color:var(--fg-2);border-color:var(--border)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.dot.live{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-2)}

#app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;min-height:50px;padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.brand{font-family:var(--font-mono);font-weight:700;font-size:13px;letter-spacing:.04em;display:flex;align-items:center;gap:8px;color:var(--fg)}
.brand svg{display:block;color:var(--accent)}
.tabs{display:flex;align-items:stretch;gap:2px;align-self:stretch}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--fg-2);min-height:40px;padding:0 10px;font-weight:500;display:flex;align-items:center;gap:8px}
.tabs button:hover{background:transparent;color:var(--fg)}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs button:disabled{color:var(--fg-3)}
.tabs .n{font-family:var(--font-mono);font-size:11px;color:var(--data)}
.subbar{display:flex;align-items:center;gap:12px;min-height:42px;padding-block:4px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--border-soft);background:var(--bg);flex-wrap:wrap}
.scope{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--r);padding:2px;gap:2px}
.scope button{border:0;background:transparent;min-height:26px;font-size:12px;color:var(--fg-2);padding:0 10px;border-radius:var(--r-sm)}
.scope button[aria-selected=true]{background:var(--surface-active);color:var(--fg)}
.scope button .caret{margin-left:4px;color:var(--fg-3)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.counter{font-family:var(--font-mono);font-size:12px;color:var(--fg-2);margin-left:auto}
.counter b{color:var(--data);font-weight:700}
.counter .link{border:0;background:none;padding:0;min-height:0;margin:0;color:var(--accent);font:inherit;cursor:pointer}
.stamp{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}

main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;max-width:1200px;width:100%;margin:0 auto}
.errors{margin-top:12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);display:flex;flex-direction:column;gap:2px}
.row.gone{opacity:.5}
.syncline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--fg-2);font-family:var(--font-mono)}
.newbar{display:flex;align-items:center;gap:10px;margin-top:14px}
.newbar input{flex:1;min-width:0}
.repo-grants{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:8px 12px;border:1px solid var(--border-soft);border-radius:var(--r);font-size:13px;color:var(--fg-2);background:var(--surface)}
.repo-grants .h2{font-size:11px}
.repo-grants .on{color:var(--fg)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-top:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft)}
.panel-h .n{font-family:var(--font-mono);font-size:12px;color:var(--data);font-weight:700}
.panel-h .sub{font-size:12px;color:var(--fg-3)}
.panel-h button.tg{border:0;background:transparent;padding:0;min-height:20px;display:inline-flex;align-items:center;gap:8px}
.panel-h button.tg .chev{display:inline-block;width:0;height:0;border-left:5px solid var(--fg-3);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform 100ms}
.panel-h button.tg[aria-expanded=true] .chev{transform:rotate(90deg)}
.empty{padding:14px;font-size:13px;color:var(--fg-3)}

.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--border-soft);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover{background:var(--surface-hover)}
.row[aria-selected=true]{background:var(--surface-hover);box-shadow:inset 2px 0 0 var(--accent)}
.row.unmatched{cursor:default}
.avatar{display:flex;align-items:center;justify-content:center;width:30px;height:30px}
.avatar.plain{border:1px solid var(--border);border-radius:var(--r-sm);font-size:10px;color:var(--fg-3);font-family:var(--font-mono);font-weight:700}
.row .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.row .l1{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.row .title{font-weight:600;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row .meta{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);white-space:nowrap}
.row .l2{font-size:13px;color:var(--fg-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l2 .q{color:var(--fg)}
.row .l2 .sep{color:var(--fg-3);margin:0 6px}
.row .act{display:flex;gap:6px;align-items:center;white-space:nowrap}
.row .prog{font-family:var(--font-mono);font-size:12px;color:var(--fg-2)}
.bar{display:inline-block;width:64px;height:4px;background:var(--border);border-radius:2px;vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.warn{background:var(--warn)}
.tree{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;padding:8px 0;border-top:1px solid var(--border-soft);font-size:13px}
.tree:first-of-type{border-top:0}
.tree.sub{padding-left:22px}
.tree .slug{font-family:var(--font-mono);color:var(--accent);min-width:140px}
.tree .t{color:var(--fg-2);min-width:0;overflow-wrap:anywhere}
.tree .answers{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--surface);border-left:1px solid var(--border);z-index:41;display:flex;flex-direction:column;overflow-y:auto}
.drawer header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);padding:14px max(20px,env(safe-area-inset-right,0px)) 12px 22px;display:flex;align-items:flex-start;gap:12px;z-index:1}
.drawer header .ttl{flex:1;min-width:0}
.drawer header h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--font-mono)}
.drawer header .flow{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:6px;letter-spacing:.02em}
.drawer header .flow .done{color:var(--fg-2)}.drawer header .flow .here{color:var(--data);font-weight:700}
.drawer .body{padding:0 max(20px,env(safe-area-inset-right,0px)) 24px 22px;display:flex;flex-direction:column}
.drawer section{padding:16px 0;border-bottom:1px solid var(--border-soft)}
.drawer section:last-child{border-bottom:0}
.drawer h3{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);display:flex;align-items:center;gap:8px}
.drawer h3 .src{font-weight:400;font-family:var(--font-mono);color:var(--fg-3);letter-spacing:0;text-transform:none;font-size:11px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:2px}
.facts dd{margin:0;font-size:13px;font-family:var(--font-mono);color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask{background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--data);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ask.critical{border-left-color:var(--danger)}
.ask.ok{border-left-color:var(--success)}
.ask .q{font-size:15px;font-weight:600;color:var(--fg)}
.ask .kv{display:grid;grid-template-columns:80px 1fr;gap:4px 10px;font-size:13px;color:var(--fg-2);margin:0}
.ask .kv dt{color:var(--fg-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}.ask .kv dd{margin:0;white-space:pre-wrap}
.ask .answers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ask .answers input{flex:1;min-width:160px}
.term{background:var(--pet-screen);color:var(--fg-2);font-family:var(--font-mono);font-size:12px;line-height:1.55;border:1px solid var(--border-soft);border-radius:var(--r);padding:10px 12px;margin:0;white-space:pre-wrap;overflow-x:auto}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px}
.checks li{display:flex;gap:8px;align-items:center;color:var(--fg-2)}
.checks .yes{color:var(--success);font-family:var(--font-mono)}.checks .no{color:var(--danger);font-family:var(--font-mono)}
.drawer .foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:16px}
.drawer .foot .path{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);word-break:break-all}
.x{border:0;background:transparent;width:32px;min-height:32px;padding:0;font-size:20px;color:var(--fg-3);border-radius:var(--r)}
.x:hover{background:var(--surface-hover);color:var(--fg)}

.menu{position:absolute;z-index:45;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:300px;padding:6px;display:flex;flex-direction:column;box-shadow:0 24px 72px rgba(0,0,0,.42)}
.menu .ws{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);font-weight:600;cursor:pointer;min-height:32px}
.menu .ws:hover{background:var(--surface-hover)}
.menu .ws .n{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3);font-weight:400}
.menu .rp{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 24px;border-radius:var(--r-sm);cursor:pointer;min-height:30px;font-size:13px;font-family:var(--font-mono)}
.menu .rp:hover{background:var(--surface-hover)}
.menu .rp .n{margin-left:auto;font-size:11px;color:var(--fg-3)}
.menu [aria-current=true]{color:var(--accent)}
.menu .hd{font-size:10px;color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 2px;font-weight:600}
.dialog{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dialog .box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);width:min(460px,100%);padding:18px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 72px rgba(0,0,0,.42)}
.dialog h2{margin:0;font-size:15px;font-weight:600;font-family:var(--font-mono)}
.dialog .opt{display:flex;flex-direction:column;gap:6px}
.dialog .opt > span{font-size:10px;color:var(--fg-2);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.dialog label.radio{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--border-soft);border-radius:var(--r);cursor:pointer;background:var(--bg)}
.dialog label.radio:has(input:checked){border-color:var(--accent)}
.dialog label.radio input{accent-color:var(--accent);margin-top:3px}
.dialog label.radio b{font-weight:600;display:block;font-size:13px}
.dialog label.radio small{color:var(--fg-3);font-size:12px}
.dialog .go{display:flex;gap:8px;justify-content:flex-end}
.dialog .note{font-size:11px;color:var(--fg-3);font-family:var(--font-mono);line-height:1.6}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kinds button{min-height:30px;font-size:12px;padding:0 6px;justify-content:center}
.kinds button[aria-pressed=true]{background:var(--surface-active);border-color:var(--accent);color:var(--fg)}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-family:var(--font-mono);font-size:12px;padding:9px 14px;border-radius:var(--r);z-index:60;max-width:min(92vw,720px);opacity:0;transition:opacity 100ms;pointer-events:none;white-space:pre-wrap}
.toast.on{opacity:1}
.toast.bad{background:var(--danger);color:#fff}

/* 科技精靈：晶片外框 + LED 眼。廠商色只在接腳、邊框、LED。只有「等你」會動。 */
.bot{display:block;overflow:hidden;flex:none}
.bot.ask .ring{animation:ringfade 1.4s ease-in-out infinite}
.bot.sleep{opacity:.55}
@keyframes ringfade{0%,100%{opacity:.25}50%{opacity:1}}
.notice{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--data);border-radius:var(--r);padding:10px 14px;margin-top:16px;font-size:13px;color:var(--fg-2)}
.notice .t{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--data);white-space:nowrap;padding-top:3px}
.notice ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px}
.notice li .now{font-family:var(--font-mono);font-size:11px;color:var(--warn);margin-right:6px}
.notice button{margin-left:auto}
.notice .link{border:0;background:none;padding:0;min-height:0;margin:0;color:var(--accent);font:inherit;text-align:left}
.notice .link:hover{text-decoration:underline;background:none}
.filters{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;align-items:center}
.filters button{min-height:28px;font-size:12px;padding:0 10px}
.filters button[aria-pressed=true]{background:var(--surface-active);border-color:var(--accent);color:var(--fg)}
.filters .src{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.day{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);padding:18px 0 6px}
.ev{display:grid;grid-template-columns:44px 180px 70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-top:1px solid var(--border-soft);font-size:13px}
.ev:first-of-type{border-top:0}
.ev .t{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
.ev .card{font-family:var(--font-mono);font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;min-height:0;padding:0;text-align:left}
.ev .card:hover{background:transparent;text-decoration:underline}
.ev .card.sys{color:var(--fg-3);cursor:default;text-decoration:none}
.ev .who{font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .who.you{color:var(--data)}
.ev .what{min-width:0;color:var(--fg);overflow-wrap:anywhere}
.drawer .ev{grid-template-columns:44px 70px minmax(0,1fr) auto;padding:8px 10px}
.drawer .ev .card{display:none}
.ev .what .ev-src{display:block;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){.bot,.bot *,.dot{animation:none!important}}

@media (max-width:900px){
  .ev{grid-template-columns:44px minmax(0,1fr) auto;row-gap:2px}
  .ev .card,.ev .who{grid-column:2}
  .ev .what{grid-column:2/4}
  .row{grid-template-columns:30px minmax(0,1fr)}
  .row .act{grid-column:2;justify-content:flex-start;flex-wrap:wrap;padding-top:4px}
  .checks{grid-template-columns:1fr}
  .tabs button{padding:0 6px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5l6.5 3.75v7.5L9 16.5 2.5 12.75v-7.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="9" r="2" fill="currentColor"/><path d="M9 7V4.2M9 14v-3M4.9 6.6l2.4 1.4M10.7 10l2.4 1.4M4.9 11.4l2.4-1.4M10.7 8l2.4-1.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>OPSX</div>
    <nav class="tabs" role="tablist" aria-label="頁面">

<script>
'use strict';
/* ---------- token、資料 ---------- */
(function(){
  /* token 走 fragment（#token=…）：不進 server log、不進 Referer；讀一次存 sessionStorage，網址列抹掉 */
  const h=new URLSearchParams(location.hash.replace(/^#/,''));const t=h.get('token')||new URLSearchParams(location.search).get('token');
  try{if(t){sessionStorage.setItem('opsx-token',t);history.replaceState(null,'',location.pathname+'#home');}}catch(e){}
})();
function token(){try{return sessionStorage.getItem('opsx-token')||'';}catch(e){return '';}}
const api={
  async collect(){const r=await fetch('/api/collect',{headers:{'X-Opsx-Token':token()}});if(r.status===401)throw new Error('token 不對：從 herdr 的 open-board 重開一次');if(!r.ok)throw new Error('collect '+r.status+'：'+(await r.text()).slice(0,200));return r.json();},
  async log(since){const r=await fetch('/api/log'+(since?'?since='+encodeURIComponent(since):''),{headers:{'X-Opsx-Token':token()}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('log '+r.status+'：'+(j.error||j.stderr||''));return j;},
  async output(pane){const r=await fetch('/api/output?pane='+encodeURIComponent(pane),{headers:{'X-Opsx-Token':token()}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error('output '+r.status+'：'+(j.error||''));return j;},
  async post(action,body){const r=await fetch('/api/'+action,{method:'POST',headers:{'X-Opsx-Token':token(),'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(action+' '+r.status+'：'+(j.error||j.stderr||''));if(!j.ok)throw new Error((j.stderr||j.stdout||'opsx '+action+' 失敗').trim());return j;}
};
let data={generated_at:null,scopes:[],cards:[],sessions:[],unmatched_agents:[],errors:[],legacy:{},worktrees_skipped:[]};let lastRaw='';
const ui={tab:'home',scope:'all',ws:null,repo:null,sel:null,open:null,doneOpen:false,busy:false,logFilter:'all',drop:null,dropText:'',fileRepo:{}};
let tl=null;let tlErr='';let bannerClosed=false;let seenAt=null;  /* 這頁最後一次送給 /api/seen 的時間 */
const outputs={};  /* 卡 key → {ok, text} 或 {ok:false, error}；抽屜打開時才抓 */
const REFRESH_MS=5000;

/* ---------- 標籤 ---------- */
const KIND={dev:'功能','bug-fix':'錯誤修正',refactoring:'重構',perf:'效能',experiment:'實驗',ops:'維運',chore:'雜務'};
const MODE_LABEL={interactive:'互動（每步問）',autopilot:'自動（開到可合併）',drive:'自動（開到可合併）'};
const PHASES=['explore','grill','propose','apply','review','pr','babysit','archive'];
const PHASE_LABEL={explore:'explore',grill:'grill',propose:'propose',apply:'apply',review:'review',pr:'MR',babysit:'MR',archive:'已合併'};
const MODEL_BY_KIND={dev:'claude-opus-5-5',refactoring:'claude-opus-5-5',perf:'claude-opus-5-5',experiment:'claude-opus-5-5','bug-fix':'claude-sonnet-5-5',chore:'claude-sonnet-5-5',ops:'claude-sonnet-5-5'};
const GRANT_LABEL={push:'push',mr:'建立 MR',migrate:'本機 migrate',delete:'刪檔',install:'裝套件',rebase:'rebase',external:'外部 API',env:'寫 .env'};
const GRANT_OF={'這次':'this','這張卡':'card','這個 repo 永遠':'repo'};
const WAIT_BADGE={'等待授權':'data','等待決定':'data','type 不明':'danger','可以合併':'ok','終端機等待輸入':'danger'};
const COND=[['opened','MR 開著'],['not_draft','不是草稿'],['no_conflicts','沒有衝突'],['pipeline','Pipeline 通過'],['threads','沒有未解的討論']];

const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=c=>c.repo+'/'+c.slug;
const byKey=k=>data.cards.find(c=>key(c)===k);
const repoTop=c=>c.path?c.path.split('/openspec/changes/')[0]:null;
function ago(iso){
  if(!iso)return '';const t=Date.parse(iso);if(isNaN(t))return iso;
  const s=Math.max(0,(Date.now()-t)/1000);
  if(s<60)return '剛剛';if(s<3600)return Math.floor(s/60)+' 分鐘';if(s<86400)return Math.floor(s/3600)+' 小時';return Math.floor(s/86400)+' 天';
}
const since=c=>ago(c.status&&c.status.at||c.dispatch&&c.dispatch.started_at||c.since);

/* ---------- 範圍 ---------- */
function wsOf(repo){const s=data.scopes.find(s=>s.repos.includes(repo));return s?s.workspace:null;}
function inScope(c){
  if(ui.scope!=='ws')return true;
  if(ui.repo)return c.repo===ui.repo;
  return wsOf(c.repo)===ui.ws;
}
function scopeLabel(){if(ui.repo)return ui.repo;if(ui.scope!=='ws')return 'workspace';return ui.ws||'沒掛的';}
const sect=name=>data.cards.filter(c=>c.section===name&&inScope(c));
/* 範圍視圖下其他 repo 也有卡在等時，多列全部範圍的總數；那些卡在首頁別處都看不到。
   數法跟首頁待處理區一樣：session 一筆算一個，收進 session 的主 change 卡不另算 */
function counterHtml(cards,sessions,inScope){
  const all=[...sessions.filter(s=>s.section==='待處理'),...cards.filter(c=>c.section==='待處理'&&!c.session)],here=all.filter(inScope).length;
  const own=here?`待處理 <b>${here}</b>`:'<span class="faint">無待處理</span>';
  return all.length>here?`${own} · <button class="link" data-act="scope-all">全部 <b>${all.length}</b></button>`:own;
}

/* ---------- 精靈 ---------- */
function bot(c,size){
  const agent=c.dispatch&&c.dispatch.agent||'claude';
  const col=agent==='codex'?'var(--pet-codex)':'var(--pet-claude)';
  const st=c.waiting?(c.waiting.type==='可以合併'?'wait':'ask'):(c.agent_status==='working'?'work':'sleep');
  const pins=[18,32,46].map(x=>`<rect x="${x-2}" y="4" width="4" height="6" fill="${col}" opacity=".9"/><rect x="${x-2}" y="54" width="4" height="6" fill="${col}" opacity=".9"/>`).join('');
  const look={ask:'0 0;3 -1;3 -1;-3 1;-3 1;0 2;0 0',work:'-3 0;3 0;-3 0',wait:'0 0;0 -2;0 0',sleep:'0 0'}[st];
  const dur={ask:'4.2s',work:'1.4s',wait:'1.6s',sleep:'1s'}[st];
  const blink=st==='sleep'?'0;0;0;0;0;0':'0;0;32;32;0;0';
  let eyes='';
  if(st==='ask')eyes=`<rect x="17" y="21" width="12" height="20" rx="2" fill="${col}"/><rect x="35" y="21" width="12" height="20" rx="2" fill="${col}"/>`;
  else if(st==='work')eyes=`<rect x="17" y="28" width="12" height="7" rx="1.5" fill="${col}"/><rect x="35" y="28" width="12" height="7" rx="1.5" fill="${col}"/>`;
  else if(st==='wait')eyes=`<path d="M16 37l7-9 7 9M34 37l7-9 7 9" stroke="${col}" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>`;
  else eyes=`<rect x="17" y="30" width="12" height="4" rx="1.5" fill="${col}"/><rect x="35" y="30" width="12" height="4" rx="1.5" fill="${col}"/>`;
  const ring=st==='ask'?`<rect class="ring" x="6" y="10" width="52" height="44" rx="5" fill="none" stroke="${col}" stroke-width="2"/>`:'';
  return `<svg class="bot ${st}" width="${size}" height="${size}" viewBox="0 0 64 64" role="img" aria-label="${esc(agent)}">${ring}${pins}<rect x="8" y="10" width="48" height="44" rx="4" fill="var(--pet-frame)" stroke="${col}" stroke-width="2"/><rect x="13" y="16" width="38" height="32" rx="2" fill="var(--pet-screen)"/><g><animateTransform attributeName="transform" type="translate" values="${look}" dur="${dur}" repeatCount="indefinite"/>${eyes}</g><rect x="13" y="16" width="38" height="0" fill="var(--pet-screen)"><animate attributeName="height" values="${blink}" keyTimes="0;.9;.93;.95;.98;1" dur="${dur==='1s'?'1s':'4.6s'}" repeatCount="indefinite"/></rect></svg>`;
}

/* ---------- 列 ---------- */
function rowAttn(c){
  const w=c.waiting;let l2='',act='';
  const rec=w.recommended?`<span class="sep">·</span>${w.needs==='run'?'在終端機跑':'建議'}：${esc(w.recommended)}`:'';
  if(w.type==='等待授權'){l2=`<span class="q">${esc(w.question||w.action||'')}</span>${rec}`;
    act=(w.options||[]).map((o,i)=>o==='拒絕'?`<button class="sm ghost danger" data-act="answer" data-text="拒絕">拒絕</button>`:`<button class="sm ${i===0?'primary':''}" data-act="answer" data-grant="${GRANT_OF[o]||''}" data-text="允許">${esc(o)}</button>`).join('');}
  else if(w.type==='等待決定'){l2=`<span class="q">${esc(w.question||'')}</span>${rec}`;act=(w.recommended&&w.needs!=='run'?`<button class="primary sm" data-act="answer" data-text="${esc(w.recommended)}">照建議</button>`:'')+`<button class="sm ${w.needs==='run'?'primary':''}" data-act="open">${w.needs==='run'?'貼結果':'自己選'}</button>`;}
  else if(w.type==='type 不明'){l2=`<span class="q">${esc(w.question||'')}</span><span class="sep">·</span>gates.md 的 type 要寫 approval | decision`;act=`<button class="sm" data-act="open">看詳情</button>`;}
  else if(w.type==='可以合併'){l2=`<span class="q">MR 五個條件都通過</span><span class="sep">·</span><span class="mono">${esc(c.mr.head_sha||'').slice(0,8)}</span>`;act=`<button class="primary sm" data-act="merge">合併</button><a class="sm" href="${esc(c.mr.url)}" target="_blank" rel="noopener"><button class="sm">開啟 MR</button></a>`;}
  else {l2=`<span class="q">${esc(w.question)}</span>`;act=`<button class="primary sm" data-act="pane">開啟 pane</button><button class="sm" data-act="stop">停止</button>`;}
  return `<div class="row" data-key="${esc(key(c))}" role="button" tabindex="0" aria-selected="${ui.sel===key(c)}">
    <div class="avatar">${bot(c,30)}</div>
    <div class="main"><div class="l1"><span class="badge ${WAIT_BADGE[w.type]}">${esc(w.type)}</span><span class="title">${esc(c.title)}</span><span class="meta">${esc(c.repo)} · ${esc(since(c))}</span></div><div class="l2">${l2}</div></div>
    <div class="act">${act}</div></div>`;
}
function rowRunning(c){
  const s=c.status;const pct=s&&s.total?Math.round(Number(s.step)/Number(s.total)*100):0;
  const stuck=c.mr&&c.mr.blocked_on;
  const mrNote=stuck?`<span class="sep">·</span><span style="color:var(--warn)">MR 卡在 ${esc(COND.find(x=>x[0]===stuck)?.[1]||stuck)}</span>`:'';
  const prog=s?`<span class="prog"><span class="bar"><i class="${stuck?'warn':''}" style="width:${pct}%"></i></span>${esc(PHASE_LABEL[s.phase]||s.phase)} ${esc(s.step)}/${esc(s.total)} · ${esc(s.label)}</span>`:`<span class="prog faint">還沒有 status.json · 階段 ${esc(c.stage)}</span>`;
  const st=c.agent_status;
  const badge=st==='working'?'<span class="badge ok"><span class="dot live"></span>執行中</span>':st==='done'?'<span class="badge line">完成</span>':st==='idle'?'<span class="badge line">閒置</span>':st==null?'<span class="badge line" title="不在 herdr 內，讀不到 agent 狀態">herdr —</span>':`<span class="badge line">${esc(st)}</span>`;
  return `<div class="row" data-key="${esc(key(c))}" role="button" tabindex="0" aria-selected="${ui.sel===key(c)}">
    <div class="avatar">${bot(c,30)}</div>
    <div class="main"><div class="l1"><span class="title">${esc(c.title)}</span><span class="meta">${esc(c.repo)} · ${esc(c.dispatch.agent||'')} · ${esc(since(c))}</span></div><div class="l2">${prog}${mrNote}</div></div>
    <div class="act">${badge}</div></div>`;
}
function rowReady(c){
  return `<div class="row" data-key="${esc(key(c))}" role="button" tabindex="0" aria-selected="${ui.sel===key(c)}">
    <div class="avatar plain">${c.stage==='apply'?'RDY':'NEW'}</div>
    <div class="main"><div class="l1"><span class="badge line">${esc(KIND[c.kind]||c.kind)}</span><span class="title">${esc(c.title)}</span><span class="meta">${esc(c.repo)} · 階段 ${esc(c.stage)} · ${esc(since(c))}</span></div></div>
    <div class="act"><button class="primary sm" data-act="dispatch">指派</button></div></div>`;
}
function rowDone(c){
  return `<div class="row" data-key="${esc(key(c))}" role="button" tabindex="0" aria-selected="${ui.sel===key(c)}">
    <div class="avatar plain">—</div>
    <div class="main"><div class="l1"><span class="title">${esc(c.title)}</span><span class="meta">${esc(c.repo)}${c.mr&&c.mr.url?' · '+esc(c.mr.url.split('/').pop()):''}</span></div></div>
    <div class="act"><span class="badge ok">已完成</span></div></div>`;
}
function rowUnmatched(a){
  return `<div class="row unmatched"><div class="avatar plain">?</div><div class="main"><div class="l1"><span class="title">${esc(a.name||'(沒名字)')}</span><span class="meta">pane ${esc(a.pane)} · ${esc(a.agent_status||'')}</span></div><div class="l2 faint">沒對到卡：不在 dispatch.json，手動開的 agent</div></div><div class="act"><button class="sm" data-act="pane-id" data-agent="${esc(a.name||'')}">開啟 pane</button></div></div>`;
}
const ORPHAN_WHY={archived:'卡已歸檔',split:'卡已拆開',stopped:'卡已停止','card-missing':'卡的目錄不在了'};
function rowOrphanSummary(n){
  return `<div class="row unmatched"><div class="avatar plain">!</div><div class="main"><div class="l1"><span class="title">孤兒 pane ${n} 個</span><span class="meta">idle 的才會關，還在做事的下一輪再看</span></div></div><div class="act"><button class="primary sm" data-act="reap-all">全部關閉</button></div></div>`;
}
function rowOrphan(o){
  return `<div class="row unmatched"><div class="avatar plain">!</div><div class="main"><div class="l1"><span class="title">${esc(o.repo)}/${esc(o.slug)}</span><span class="meta">pane ${esc(o.pane)} · ${esc(o.agent_status||'')}</span></div><div class="l2 faint">孤兒 pane：${esc(ORPHAN_WHY[o.reason]||o.reason)}</div></div><div class="act"><button class="sm" data-act="reap" data-pane="${esc(o.pane)}">關閉</button></div></div>`;
}
/* session（subchange-fanout D7）：一筆 session 一張卡，點開是主 change → 子 change 的樹。tests/board-tree.test.sh 從這裡切到 rowSession */
function sessionLine(s){
  const c=s.current;
  return `${s.feature} · 主 change ${s.main_done}/${s.main_total} · 子 change ${s.sub_done}/${s.sub_total} · ${c?[c.slug,c.stage].filter(Boolean).join(' '):'已合併'}`;
}
function treeRows(s){
  const gate=x=>x.waiting&&x.waiting.gate_id?' · '+[x.waiting.gate_id,x.waiting.question].filter(Boolean).join(' '):x.open_gates.length?' · '+x.open_gates.map(g=>g.id).join(' '):'';
  const stage=x=>x.stage||'—';
  return s.mains.flatMap(m=>{
    /* herdr agent 名：dispatch.json 的 herdr_name，沒有這個欄位就是 slug（bin/lib/route.sh） */
    const who=m.dispatch?[m.dispatch.herdr_name||m.slug,m.agent_status].filter(Boolean).join(' '):'—';
    return [{main:m.slug,sub:null,waiting:m.waiting,text:`${who} · ${stage(m)}${gate(m)}`},
      ...m.subs.map(x=>({main:m.slug,sub:x.slug,waiting:x.waiting,text:`${x.worker||'—'} · ${stage(x)}${gate(x)}`}))];
  });
}
const answerBody=(main,sub,gate,text)=>sub?{slug:main,sub,gate,text}:{slug:main,gate,text};
/* 首頁一個 section 要畫的：session 照自己的 section 放，收進 session 的主 change 卡不單獨畫 */
const homeSect=(cards,sessions,name)=>({sessions:sessions.filter(s=>s.section===name),cards:cards.filter(c=>c.section===name&&!c.session)});
const skey=s=>'session:'+s.repo+'/'+s.feature;
function rowSession(s){
  const k=skey(s);
  return `<div class="row" data-key="${esc(k)}" role="button" tabindex="0" aria-selected="${ui.sel===k}">
    <div class="avatar plain">${s.current?'SES':'—'}</div>
    <div class="main"><div class="l1"><span class="title">${esc(sessionLine(s))}</span><span class="meta">${esc(s.repo)}</span></div></div>
    <div class="act"></div></div>`;
}
const panel=(title,n,sub,body)=>`<section class="panel"><div class="panel-h"><span class="h2">${title}</span><span class="n">${n}</span>${sub?`<span class="sub">${sub}</span>`:''}</div>${body}</section>`;

function renderHome(){
  const H=name=>homeSect(data.cards.filter(inScope),data.sessions.filter(inScope),name);
  const A=H('待處理'),R=H('進行中'),Y=H('待指派'),D=H('已完成');
  const n=x=>x.sessions.length+x.cards.length;
  const list=(x,row)=>x.sessions.map(rowSession).join('')+x.cards.map(row).join('');
  const un=ui.scope==='all'?data.unmatched_agents.filter(a=>!a.orphan):[];
  const orph=data.orphans||[];   // 孤兒不屬於任何範圍，範圍篩選不影響
  const leg=Object.entries(data.legacy||{}).filter(([r])=>ui.scope!=='ws'||(ui.repo?r===ui.repo:wsOf(r)===ui.ws));
  let h=renderBanner()+panel('待處理',n(A),'只有你能做的：授權、決定、合併、終端機卡住',n(A)?list(A,rowAttn):'<div class="empty">沒有等你的事</div>');
  h+=panel('進行中',n(R)+un.length+orph.length,'進度 status.json · 狀態 herdr',(list(R,rowRunning)+un.map(rowUnmatched).join('')+(orph.length?rowOrphanSummary(orph.length)+orph.map(rowOrphan).join(''):''))||'<div class="empty">沒有執行中的工作</div>');
  h+=panel(ui.scope==='ws'?`待指派 · ${esc(scopeLabel())}`:'待指派',n(Y),'explore 過、還沒派出去的（剛收進來的在收件匣）',(n(Y)?list(Y,rowReady):'<div class="empty">沒有待指派的工作</div>')+(leg.length?`<div class="empty">舊 schema 的 change 不列（沒有 inbox.md、不是 schema: opsx）：${leg.map(([r,n])=>`${esc(r)} ${n}`).join(' · ')}</div>`:''));
  h+=`<section class="panel"><div class="panel-h"><button class="tg h2" data-act="done-toggle" aria-expanded="${ui.doneOpen}"><span class="chev"></span>已完成</button><span class="n">${n(D)}</span></div>${ui.doneOpen?(n(D)?list(D,rowDone):'<div class="empty">還沒有</div>'):''}</section>`;
  return h;
}
/* 收件匣：沒派出、還沒 explore 的卡，依 inbox.md 的 source 分組 */
const INBOX_GROUPS=[
  ['agent 回報','agent、audit、deepen 寫的卡',s=>/^(agent|audit|deepen):/.test(s)],
  ['我新增','＋新增或貼上的',s=>s==='me'||s==='paste'],
  ['同步來源','GitLab · GitHub 指派給你的 issue',s=>/^(gitlab|github):/.test(s)],
  ['技術債','code 裡的 shortcut: 註解',s=>/^shortcut:/.test(s)],
];

const dayOf=ts=>{if(!ts)return '時間不明';const d=new Date(ts);return isNaN(d)?'時間不明':d.toLocaleDateString('sv');};
const hhmm=ts=>{if(!ts)return '';const d=new Date(ts);return isNaN(d)?'':d.toTimeString().slice(0,5);};
function evRow(e){

function renderLog(){
  const fb=([k,l])=>`<button aria-pressed="${ui.logFilter===k}" data-act="logf" data-f="${k}">${l}</button>`;
  let h=`<div class="filters">${LOG_FILTERS.map(fb).join('')}<span class="src">decisions.tsv · sync.log · archive</span></div>`;
  if(tlErr)return h+`<div class="empty" style="color:var(--danger)">${esc(tlErr)}</div>`;
  if(!tl)return h+'<div class="empty">載入中…</div>';
  const keep=tl.events.filter(e=>evInScope(e)&&evKeep(e));
  if(!keep.length)return h+'<div class="empty">沒有符合的紀錄</div>';
  const shown=keep.slice(0,ui.logLimit);
  const days=[];for(const e of shown){const d=dayOf(e.ts);const g=days[days.length-1];if(g&&g.d===d)g.ev.push(e);else days.push({d,ev:[e]});}
  h+=days.map(g=>`<div class="day">${esc(g.d)} · ${g.ev.length}</div><section class="panel" style="margin-top:0">${g.ev.map(evRow).join('')}</section>`).join('');
  const rest=keep.length-shown.length;
  if(rest>0)h+=`<div class="empty"><button class="ghost sm" data-act="log-more">載入更多（還有 ${rest} 列）</button></div>`;
  if(tl.errors&&tl.errors.length)h+=`<div class="empty">讀不了的檔：${tl.errors.map(x=>esc(x.source)).join('、')}</div>`;

}

/* ---------- 離開期間 banner：只列 last_seen 之後有時間戳的事，加上「現在」的狀態 ---------- */
const after=(ts,ls)=>!!ts&&Date.parse(ts)>=Date.parse(ls);  /* 等於也算：同一秒寫入的事件寧可重複不要漏 */
function bannerItems(events,cards,lastSeen){
  const items=[];const merged=new Set();
  for(const e of events){
    if(!after(e.ts,lastSeen))continue;
    const k=e.repo+'/'+e.slug;
    if(e.source==='sync'){if(e.new>0)items.push({text:`同步 ${e.evidence}：${e.new} 張新卡`});continue;}
    if(e.who==='你')continue;
    if(e.tag==='替你決定')items.push({key:k,text:`${e.slug}：${e.who} 替你決定「${e.text}」`});
    else if(e.tag==='已合併'){merged.add(k);items.push({key:k,text:`${e.slug} 已合併`});}
    else if(e.tag==='已指派'&&e.who==='系統')items.push({key:k,text:`${e.slug} 自動派出：${e.text}`});
  }
  for(const c of cards){
    const k=c.repo+'/'+c.slug;
    for(const g of c.open_gates||[])if(after(g.opened_at,lastSeen))items.push({key:k,text:`${c.slug} 開了 gate ${g.id}`});
    if(c.mr&&after(c.mr.created_at,lastSeen))items.push({key:k,text:`${c.slug} 開了 MR`});
    if(c.mr&&after(c.mr.merged_at,lastSeen)&&!merged.has(k)){merged.add(k);items.push({key:k,text:`${c.slug} 已合併`});}
  }
  for(const c of cards){
    if(c.section==='已完成')continue;  /* archive 不清 dispatch.json，已完成的卡 agent 不在是正常的 */
    const k=c.repo+'/'+c.slug;
    if(c.agent_status==='blocked')items.push({key:k,now:true,text:`${c.slug} 的 agent 卡在終端機`});
    else if(c.dispatch&&c.agent_status==='unknown')items.push({key:k,now:true,text:`${c.slug} 的 agent 不在 herdr 裡（停了或掛了）`});
  }
  return items;
}
function renderBanner(){

  if(!tl.last_seen)return `<div class="notice" role="status"><span class="t">第一次開板</span><span>之後離開期間的變化會列在這裡</span>${close}</div>`;
  /* 不套首頁範圍：last-seen 是全域的，關閉會越過畫面上沒列的卡 */
  const items=bannerItems(tl.events,data.cards,tl.last_seen);

}
async function closeBanner(){
  /* last-seen 不能晚於 banner 讀過的任一份快照，否則兩份快照之間發生的事永遠不會進 banner */
  if(!data.generated_at){toast('collect 還沒回來，卡片上的 gate 與 MR 還沒讀到，先不能關閉',true);return;}
  const at=Date.parse(data.generated_at)<Date.parse(tl.generated_at)?data.generated_at:tl.generated_at;
  try{await api.post('seen',{at});seenAt=at;bannerClosed=true;render();}

}

  const mine=tl?tl.events.filter(e=>e.repo===c.repo&&e.slug===c.slug):[];
  const logSec=`<section><h3>紀錄 <span class="src">decisions.tsv</span></h3>${tlErr?`<div class="faint" style="color:var(--danger)">${esc(tlErr)}</div>`:!tl?'<div class="faint">載入中…</div>':mine.length?`<div class="panel" style="margin-top:0">${mine.map(evRow).join('')}</div>`:'<div class="faint">這張卡還沒有紀錄</div>'}</section>`;
  const foot=`<div class="foot">${d.pane?`<button class="ghost sm" data-act="pane">開啟 pane ${esc(d.pane)}</button><button class="ghost sm" data-act="stop">停止</button>`:''}${c.section!=='已完成'?`<button class="ghost sm" data-act="dispatch">${d.pane?'重新指派':'指派'}</button>`:''}<span class="path">${esc(c.path||'')}</span></div>`;
  const headBadge=w?`<span class="badge ${WAIT_BADGE[w.type]}">${esc(w.type)}</span>`:c.agent_status==='working'?'<span class="badge ok"><span class="dot live"></span>執行中</span>':'';
  $('#drawer').innerHTML=`<header><div style="padding-top:2px">${bot(c,40)}</div><div class="ttl"><h2>${esc(c.title)}${headBadge}</h2><div class="flow">${flowLine(c)}</div></div><button class="x" data-act="close" aria-label="關閉">×</button></header><div class="body">${ask}${facts}${prog}${out}${mr}${logSec}${foot}</div>`;
  $('#drawer').hidden=false;$('#scrim').hidden=false;
  const nr=$('#reply');if(nr&&keep){nr.value=keep.v;if(keep.focus){nr.focus();try{nr.setSelectionRange(keep.s,keep.s);}catch(e){}}}
}
async function loadOutput(c){
  const k=key(c);
  try{outputs[k]=await api.output(c.dispatch.pane);}catch(e){outputs[k]={ok:false,error:e.message};}
  if(ui.open===k)renderDrawer();
}
function openDrawer(k){ui.open=k;ui.sel=k;const c=byKey(k);if(c&&c.dispatch&&c.dispatch.pane){delete outputs[k];loadOutput(c);}render();if(!tl)loadLog();const x=$('#drawer .x');if(x)x.focus();}
function closeDrawer(){ui.open=null;$('#drawer').hidden=true;$('#scrim').hidden=$('#dialog').hidden;render();}

/* ---------- 動作（全部打 server，server 再叫 opsx）---------- */
let toastT;
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.classList.toggle('bad',!!bad);t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),bad?6000:2800);}
async function act(label,fn){
  if(ui.busy)return;ui.busy=true;
  try{const r=await fn();toast(label+(r&&r.stdout?'\n'+r.stdout.trim():''));await refresh(true);}
  catch(e){toast(label+' 失敗：'+e.message,true);}
  finally{ui.busy=false;}
}
function answer(c,text,grant){
  if(!c.waiting||!c.waiting.gate_id){toast('這一項沒有 gate 可回',true);return;}
  act(`opsx answer ${c.slug} --gate ${c.waiting.gate_id}${grant?' --grant '+grant:''} "${text}"`,()=>api.post('answer',{slug:c.slug,gate:c.waiting.gate_id,grant:grant||'',text,repo:repoTop(c)}));
}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast('已複製'),()=>toast('複製失敗，請手動選取',true));}
function answerTree(s,b){
  act(`opsx answer ${b.main}${b.sub?' --sub '+b.sub:''} --gate ${b.gate}${b.grant?' --grant '+b.grant:''} "${b.text}"`,
    ()=>api.post('answer',{...answerBody(b.main,b.sub,b.gate,b.text),grant:b.grant,repo:(data.repo_paths||{})[s.repo]}));
}
function merge(c){act(`opsx merge ${c.slug}`,()=>api.post('merge',{slug:c.slug,repo:repoTop(c)}));}
function stop(c){act(`opsx stop ${c.slug}`,()=>api.post('stop',{slug:c.slug,repo:repoTop(c)}));}
function reap(pane){act(`opsx reap${pane?' --pane '+pane:''}`,()=>api.post('reap',pane?{pane}:{}));}
function focusAgent(agent){
  if(!agent){toast('這張沒有 pane',true);return;}
  act(`herdr agent focus ${agent}`,()=>api.post('focus',{agent}));
}

/* ＋新增：範圍選到單一 repo 就建在那個 repo，否則進待分類（board-inbox D6） */
const newRepo=()=>ui.scope==='ws'&&ui.repo?(data.repo_paths||{})[ui.repo]||null:null;
function openNew(){$('#newbar').hidden=false;$('#new-where').textContent=newRepo()?'建在 '+ui.repo:'進待分類（範圍選到單一 repo 才直接建殼）';$('#new-text').focus();}
function closeNew(){$('#newbar').hidden=true;$('#new-text').value='';}
function submitNew(){
  const text=$('#new-text').value.trim();if(!text)return;
  const repo=newRepo();closeNew();
  act(`opsx new${repo?' --repo '+repo:''} -- ${text}`,()=>api.post('new',repo?{text,repo}:{text}));
}

/* 先 explore：互動模式派出，第一句由 dispatch 從 stage 推，收件卡一定是 /explore（board-inbox D5） */
function exploreFirst(c){act(`opsx dispatch ${c.slug} --mode interactive --kind ${c.kind}`,()=>api.post('dispatch',{slug:c.slug,mode:'interactive',kind:c.kind,repo:repoTop(c)}));}
function submitDrop(id,text){
  ui.drop=null;ui.dropText='';
  if(id.startsWith('unfiled:')){const slug=id.slice(8);act(`opsx drop ${slug} -- ${text}`,()=>api.post('drop',{slug,text}));return;}
  const c=byKey(id);if(!c){render();return;}
  act(`opsx drop ${c.slug} --repo ${repoTop(c)} -- ${text}`,()=>api.post('drop',{slug:c.slug,repo:repoTop(c),text}));
}
/* 立即同步：409 是另一支同步還在跑（launchd 或另一個分頁），不是錯誤 */
async function syncNow(){
  if(ui.busy)return;ui.busy=true;toast('opsx sync 跑中…');
  try{
    const r=await fetch('/api/sync',{method:'POST',headers:{'X-Opsx-Token':token(),'Content-Type':'application/json'},body:'{}'});
    const j=await r.json().catch(()=>({}));
    if(r.status===409)toast('同步進行中');
    else if(!r.ok||!j.ok)toast('opsx sync 失敗：'+(j.error||j.stderr||r.status),true);
    else{toast((j.stdout||'').trim());await refresh(true);}
  }catch(e){toast('opsx sync 失敗：'+e.message,true);}
  finally{ui.busy=false;}
}
function fileUnfiled(rowEl){
  const slug=rowEl.dataset.unfiled,r=rowEl.querySelector('select').value;
  if(!r){toast('先選 repo',true);return;}
  const repo=data.repo_paths[r];
  act(`opsx file ${slug} --repo ${repo}`,()=>api.post('file',{slug,repo}));
}

/* ---------- 指派對話框 ---------- */
let dlgFor=null;
function openDispatch(c){
  dlgFor=key(c);
  const kind=c.kind||'dev';const ws=wsOf(c.repo);const g=c.grants_repo||{};const granted=Object.keys(g).filter(k=>g[k]).map(k=>GRANT_LABEL[k]||k);
  $('#dialog').innerHTML=`<div class="box"><h2>指派 · ${esc(c.title)}</h2>
    <div class="opt"><span>Agent</span><label class="radio"><input type="radio" name="ag" value="claude" checked><span><b>claude</b><small>走 opsx hook，會寫 gate</small></span></label><label class="radio"><input type="radio" name="ag" value="codex"><span><b>codex</b><small>gpt-5 · 同一套 skill，status 由 skill 顯式寫</small></span></label></div>
    <div class="opt"><span>類型（寫進 .openspec.yaml，決定 playbook）</span><div class="kinds">${Object.keys(KIND).map(k=>`<button data-kind="${k}" aria-pressed="${k===kind}">${KIND[k]}</button>`).join('')}</div></div>
    <div class="opt"><span>模型（預設照類型；codex 只有 gpt-5）</span><div class="kinds models" style="grid-template-columns:repeat(3,minmax(0,1fr))"><button data-model="claude-opus-5-5" aria-pressed="${MODEL_BY_KIND[kind]==='claude-opus-5-5'}">opus 5.5</button><button data-model="claude-sonnet-5-5" aria-pressed="${MODEL_BY_KIND[kind]==='claude-sonnet-5-5'}">sonnet 5.5</button><button data-model="gpt-5" aria-pressed="false">gpt-5（codex）</button></div></div>
    <div class="opt"><span>自主程度</span><label class="radio"><input type="radio" name="md" value="interactive"><span><b>互動</b><small>每一步都問你</small></span></label><label class="radio"><input type="radio" name="md" value="autopilot" checked><span><b>自動</b><small>一路做到可以合併，要你決定或授權的寫 gate；合併仍是你</small></span></label></div>
    <div class="note">階段 ${esc(c.stage)}：派出後第一句是 /${esc(c.stage)} ${esc(c.slug)}<br>pane 開在 ${ws?esc(ws):`新 workspace「${esc(c.repo)}」`}<br>${esc(c.repo)} 長期授權：${granted.length?esc(granted.join('、')):'無（碰到會寫 gate）'}</div>
    <div class="go"><button data-act="dlg-cancel">取消</button><button class="primary" data-act="dlg-go">指派</button></div></div>`;
  $('#dialog').hidden=false;$('#scrim').hidden=false;
}
function closeDispatch(){dlgFor=null;$('#dialog').hidden=true;$('#scrim').hidden=$('#drawer').hidden;}
function doDispatch(){
  const c=byKey(dlgFor);if(!c)return;
  const agent=$('#dialog input[name=ag]:checked').value,mode=$('#dialog input[name=md]:checked').value;
  const kb=$('#dialog .kinds:not(.models) button[aria-pressed=true]');const mb=$('#dialog .models button[aria-pressed=true]');
  const kind=kb?kb.dataset.kind:c.kind;const model=agent==='codex'?'gpt-5':(mb?mb.dataset.model:MODEL_BY_KIND[kind]);
  closeDispatch();
  act(`opsx dispatch ${c.slug} --agent ${agent} --model ${model} --mode ${mode} --kind ${kind}`,()=>api.post('dispatch',{slug:c.slug,agent,model,mode,kind,repo:repoTop(c)}));
}

/* ---------- 範圍選單 ---------- */
function openMenu(anchor){
  const cnt=r=>data.cards.filter(c=>c.repo===r&&c.section!=='已完成').length;
  const rp=(r,ws)=>`<div class="rp" role="menuitem" tabindex="0" data-ws="${esc(ws||'')}" data-repo="${esc(r)}" aria-current="${ui.scope==='ws'&&ui.repo===r}"><span>${esc(r)}</span><span class="n">${cnt(r)}</span></div>`;
  $('#menu').innerHTML=`<div class="hd">workspace · repo</div>`+data.scopes.map(s=>`<div class="ws" role="menuitem" tabindex="0" data-ws="${esc(s.workspace||'')}" aria-current="${ui.scope==='ws'&&ui.ws===s.workspace&&!ui.repo}"><span class="${s.workspace?'':'faint'}">${esc(s.workspace||'沒掛的')}</span><span class="n">${s.repos.reduce((n,r)=>n+cnt(r),0)}</span></div>${s.repos.map(r=>rp(r,s.workspace)).join('')}`).join('')
    +`<div class="hd" style="padding-top:10px;text-transform:none;letter-spacing:0;font-weight:400">對應在 workspaces.toml；repo 清單來自掃 ~/code/*/openspec/</div>`;
  const r=anchor.getBoundingClientRect();const m=$('#menu');m.style.left=Math.max(8,r.left)+'px';m.style.top=(r.bottom+6+window.scrollY)+'px';m.hidden=false;
}
const closeMenu=()=>{$('#menu').hidden=true;};

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]');
  const rowEl=e.target.closest('.row[data-key]');
  const k=(btn&&btn.closest('[data-key]')||rowEl)?.dataset.key||ui.open;
  const c=k?byKey(k):null;
  if(e.target.closest('a[href]'))return;
  if(e.target.matches('input,select'))return;
  if(btn){
    e.stopPropagation();const a=btn.dataset.act;
    if(a==='done-toggle'){ui.doneOpen=!ui.doneOpen;render();return;}
    if(a==='close'){closeDrawer();return;}
    if(a==='dlg-cancel'){closeDispatch();return;}
    if(a==='dlg-go'){doDispatch();return;}
    if(a==='pane-id'){focusAgent(btn.dataset.agent);return;}
    if(a==='reap'){reap(btn.dataset.pane);return;}
    if(a==='reap-all'){reap('');return;}
    if(a==='sync'){syncNow();return;}
    if(a==='file'){fileUnfiled(btn.closest('[data-unfiled]'));return;}
    if(a==='drop-open'){ui.drop=btn.dataset.drop;ui.dropText='';render();const i=$('.drop-reason');if(i)i.focus();return;}
    if(a==='banner-close'){closeBanner();return;}
    if(a==='scope-all'){$('#scope-all').click();return;}
    if(a==='logf'){setLogFilter(btn.dataset.f);render();return;}
    if(a==='log-more'){logMore();render();return;}
    if(a==='ev-open'){if(!byKey(btn.dataset.key)){toast(btn.dataset.key+' 不在首頁（archive 只列最新的幾張）',true);return;}showTab('home');openDrawer(btn.dataset.key);return;}
    if(a==='copy'){copyText(btn.dataset.text);return;}
    if(a==='tree-answer'){const s=data.sessions.find(s=>skey(s)===ui.open);if(s)answerTree(s,btn.dataset);return;}
    if(!c)return;
    if(a==='open'){openDrawer(k);return;}
    if(a==='answer'){answer(c,btn.dataset.text,btn.dataset.grant);return;}
    if(a==='merge'){merge(c);return;}
    if(a==='stop'){stop(c);return;}
    if(a==='pane'){focusAgent(c.dispatch&&c.dispatch.pane?c.slug:'');return;}
    if(a==='dispatch'){openDispatch(c);return;}
    if(a==='explore'){exploreFirst(c);return;}
    return;
  }
  const kb=e.target.closest('#dialog .kinds button');
  if(kb){[...kb.parentElement.children].forEach(b=>b.setAttribute('aria-pressed',b===kb));
    if(kb.dataset.kind){const m=MODEL_BY_KIND[kb.dataset.kind];document.querySelectorAll('#dialog .models button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.model===m));}
    return;}
  const tb=e.target.closest('#tab-home,#tab-inbox,#tab-log');
  if(tb){showTab(tb.id.slice(4));return;}
  const mi=e.target.closest('#menu [data-ws]');
  if(mi){setScope('ws',mi.dataset.ws||null,mi.dataset.repo||null);closeMenu();render();return;}
  if(rowEl){openDrawer(rowEl.dataset.key);return;}
  if(e.target.id==='scrim'){if(!$('#dialog').hidden)closeDispatch();else closeDrawer();return;}
  if(!e.target.closest('#menu'))closeMenu();
});
document.addEventListener('input',e=>{if(e.target.classList.contains('drop-reason'))ui.dropText=e.target.value;});
document.addEventListener('change',e=>{const r=e.target.closest('[data-unfiled]');if(r&&e.target.matches('select'))ui.fileRepo[r.dataset.unfiled]=e.target.value;});
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,select')){
    if(e.target.classList.contains('drop-reason')){
      if(e.key==='Escape'){ui.drop=null;ui.dropText='';render();}
      else if(e.key==='Enter'&&e.target.value.trim())submitDrop(e.target.dataset.drop,e.target.value.trim());
      return;}
    if(e.target.id==='new-text'){if(e.key==='Enter')submitNew();else if(e.key==='Escape')closeNew();return;}
    if(e.key==='Enter'&&e.target.id==='reply'){const c=byKey(ui.open);const v=e.target.value.trim();if(c&&v)answer(c,v,null);}
    return;
  }
  if(e.key==='Escape'){if(!$('#dialog').hidden)closeDispatch();else if(ui.open)closeDrawer();else closeMenu();return;}
  if(e.key==='j'||e.key==='ArrowDown'){move(1);e.preventDefault();}
  else if(e.key==='k'||e.key==='ArrowUp'){move(-1);e.preventDefault();}
  else if(e.key==='Enter'&&ui.sel&&!ui.open)openDrawer(ui.sel);
  else if(e.key==='r')refresh(true);
});
function move(d){
  const ks=[...document.querySelectorAll('#view .row[data-key]')].map(r=>r.dataset.key);if(!ks.length)return;
  const i=ks.indexOf(ui.sel);ui.sel=ks[Math.max(0,Math.min(ks.length-1,i+d))];render();
  const el=document.querySelector(`#view .row[data-key="${CSS.escape(ui.sel)}"]`);if(el)el.scrollIntoView({block:'nearest'});
}
$('#new-open').onclick=openNew;
$('#scope-all').onclick=()=>{setScope('all',ui.ws,null);closeMenu();render();};
$('#scope-ws').onclick=e=>{e.stopPropagation();if($('#menu').hidden)openMenu(e.currentTarget);else closeMenu();};

/* ---------- 重新整理：上一次回來才排下一次（collect 慢時不會疊請求）；分頁藏起來就不拉；
   內容沒變就不重畫（比對時排除 generated_at，它每次都變），展開、捲動、打到一半的回覆都留著 ---------- */
let inflight=false,timer=null;
async function refresh(force){
  if(inflight)return;inflight=true;
  try{
    const j=await api.collect();const {generated_at,...rest}=j;const raw=JSON.stringify(rest);
    if(force||raw!==lastRaw){lastRaw=raw;data=j;render();}
    else{data.generated_at=generated_at;$('#stamp').textContent='collect '+ago(generated_at);}
  }catch(e){
    if(!lastRaw)setView($('#view'),`<div class="empty" style="color:var(--danger)">${esc(e.message)}</div>`,false);
    else{data.errors=[{source:'board',message:e.message}];render();}
  }finally{inflight=false;schedule();}
}
function schedule(){clearTimeout(timer);timer=setTimeout(()=>{if(document.hidden){schedule();return;}refresh(false);},REFRESH_MS);}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh(false);loadLog();}});
if(location.hash==='#log')showTab('log');else{if(location.hash==='#inbox')ui.tab='inbox';if(location.hash!=='#'+ui.tab)history.replaceState(null,'','#'+ui.tab);loadLog();}
refresh(true);
</script>
</body>
</html>
