feature: User Authentication
created: 2026-05-26
status: active

context: |
  Simple Express todo API (in-memory todos, no DB, no auth).
  Decision: JWT (stateless, pure API), SQLite for persistence,
  two roles (user / admin). No refresh token in v1.

prs:
  - name: auth-infra
    branch: feat/auth-infra
    status: pending
    depends-on: []
    description: "DB schema + auth utilities — low risk, merge first"
    changes:
      - name: add-sqlite-and-schema
        status: pending
        description: "引入 better-sqlite3，建 users 表（id, email, password_hash, role）和 todos 表（id, title, done, user_id, created_at）"
      - name: add-auth-utilities
        status: pending
        description: "JWT sign/verify 工具（jsonwebtoken），bcrypt hash/verify（bcryptjs）"

  - name: auth-core
    branch: feat/auth-core
    status: pending
    depends-on: [auth-infra]
    description: "Auth middleware + auth routes — core logic, careful review"
    changes:
      - name: add-auth-middleware
        status: pending
        description: "authenticate middleware（驗 JWT，把 user 掛到 req.user），authorize(role) middleware（檢查 req.user.role）"
      - name: add-auth-routes
        status: pending
        description: "POST /api/auth/register（建帳號，hash password），POST /api/auth/login（驗證，回 JWT）"

  - name: todos-auth-integration
    branch: feat/todos-auth-integration
    status: pending
    depends-on: [auth-infra, auth-core]
    description: "Wire auth into todos routes — breaking change, review carefully"
    changes:
      - name: migrate-todos-to-db
        status: pending
        description: "把 src/routes/todos.js 的 in-memory array 換成 SQLite queries"
      - name: add-todo-ownership
        status: pending
        description: "todos 加 user_id，所有 CRUD route 加 authenticate middleware，GET/POST/PATCH/DELETE 只操作 req.user.id 的 todos"
      - name: add-admin-todos-route
        status: pending
        description: "新增 GET /api/admin/todos，加 authorize('admin') middleware，回傳所有 users 的 todos"
